apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memory-api-chart.fullname" . }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "memory-api-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "memory-api-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "memory-api-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with include "memory-api-chart.imagePullSecrets" . | fromYamlArray }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "memory-api-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "memory-api-chart.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              #containerPort: {{ .Values.service.port }}
              containerPort: {{ .Values.environment.PORT }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.environment.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.environment.PORT | quote }}
            - name: CORS_ORIGIN
              value: {{ .Values.environment.CORS_ORIGIN | quote }}
            - name: OLLAMA_URL # For embeddings call
              value: {{ .Values.environment.OLLAMA_URL | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.environment.EMBEDDING_MODEL | default "nomic-embed-text" | quote }}
            - name: SUMMARIZATION_MODEL
              value: {{ .Values.environment.SUMMARIZATION_MODEL | default "qwen3.5:2b" | quote }}
            - name: ALLOW_SELF_SIGNED_CERTS
              value: {{ .Values.environment.ALLOW_SELF_SIGNED_CERTS | default "false" | quote }}
            - name: ADMIN_API_URL
              value: {{ .Values.environment.ADMIN_API_URL | default "" | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memory-api-chart.dbSecretName" . }}
                  key: DATABASE_URL
            # OpenTelemetry — OTLP traces + metrics to the node-local collector.
            # The collector is a hostNetwork daemonset listening on every node, so it
            # is reached via the node IP (downward API), NOT a ClusterIP service.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.environment.OTEL_SERVICE_NAME | quote }}
            # Stamped on direct-scraped /metrics so they line up with the collector-routed
            # otel_* series. Sourced from the cluster-vars ConfigMap via the HelmRelease.
            - name: ENVIRONMENT_ID
              value: {{ .Values.environment.ENVIRONMENT_ID | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
