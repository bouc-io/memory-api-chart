# Sandbox-specific values for memory-api-chart
# Only include values that differ from base or local, or are required for sandbox

replicaCount: 2

image:
  registry: ghcr.io/bouc-io
  repository: application/memory/memory-api-server
  tag: "1.0.2254680589"
  pullPolicy: IfNotPresent
  # tag will be managed by FluxCD, do not set here

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: memory-sandbox.bouc.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: memory-sandbox-tls
      hosts:
        - memory-sandbox.bouc.io

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

postgresql:
  enabled: true
  global:
    ## Security parameters
    ##
    security:
      allowInsecureImages: true
  # Override image for pgvector
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: 0.8.1-pg18-trixie
  auth:
    username: ps_memory_snbx
    database: ps_memory_db_snbx
    # Both the bundled Postgres and the app read from this ESO-managed Secret:
    # Postgres takes the `password` key, the app takes the `DATABASE_URL` key that
    # the ExternalSecret template assembles. Keep username and database in sync
    # with the DSN in infrastructure/external-secrets/externalsecrets/sandbox/.
    existingSecret: boucio-memory-db-secret
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
  architecture: standalone

environment:
  # Environment identity for telemetry labels. ${ENVIRONMENT_ID} is substituted from the
  # manually-created cluster-vars ConfigMap by Flux postBuild (local-config Kustomization).
  ENVIRONMENT_ID: "${ENVIRONMENT_ID}"
  NODE_ENV: "production"
  PORT: 3000
  CORS_ORIGIN: "*.bouc.io"
  OLLAMA_URL: "http://ollama-chart.default.svc.cluster.local:11434"
  EMBEDDING_MODEL: "nomic-embed-text"
  SUMMARIZATION_MODEL: "qwen3.5:2b"
  ALLOW_SELF_SIGNED_CERTS: "false"
  ADMIN_API_URL: "http://admin-api-chart.default.svc.cluster.local:80"

# If using external DB in sandbox, override here
externalDatabase:
  host: ""
  port: 5432
  user: bn_memory
  database: bitnami_memory
  password: ""
  existingSecret: ""
  existingSecretHostKey: ""
  existingSecretPortKey: ""
  existingSecretUserKey: ""
  existingSecretDatabaseKey: ""
  existingSecretPasswordKey: ""
  annotations: {}
