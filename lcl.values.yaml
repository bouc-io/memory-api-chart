# Local environment values for memory-api-chart
# Only include values that differ from base or are required for local

# replicaCount left as 1 (default)

image:
  registry: ghcr.io/bouc-io
  repository: application/memory/memory-api-server
  tag: "1.0.2254680589"
  pullPolicy: IfNotPresent
  # tag will be managed by FluxCD, do not set here

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: memory-chart.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

postgresql:
  enabled: true
  global:
    ## Security parameters
    ##
    security:
      allowInsecureImages: true
  # Override image for pgvector
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: 0.8.1-pg18-trixie
  auth:
    username: ps_memory
    database: ps_memory_db
    # Both the bundled Postgres and the app read from this ESO-managed Secret:
    # Postgres takes the `password` key, the app takes the `DATABASE_URL` key that
    # the ExternalSecret template assembles. Keep username and database in sync
    # with the DSN in infrastructure/external-secrets/externalsecrets/local/.
    existingSecret: boucio-memory-db-secret
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
  architecture: standalone

environment:
  # Environment identity for telemetry labels. ${ENVIRONMENT_ID} is substituted from the
  # manually-created cluster-vars ConfigMap by Flux postBuild (local-config Kustomization).
  ENVIRONMENT_ID: "${ENVIRONMENT_ID}"
  NODE_ENV: "development"
  PORT: 3000
  CORS_ORIGIN: "*"
  OLLAMA_URL: "http://ollama-chart.default.svc.cluster.local:11434"
  EMBEDDING_MODEL: "nomic-embed-text"
  SUMMARIZATION_MODEL: "qwen3.5:2b"
  ALLOW_SELF_SIGNED_CERTS: "true"
  ADMIN_API_URL: "http://admin-api-chart.default.svc.cluster.local:80"

externalDatabase:
  host: ""
  port: 5432
  user: bn_memory
  database: bitnami_memory
  password: ""
  existingSecret: ""
  existingSecretHostKey: ""
  existingSecretPortKey: ""
  existingSecretUserKey: ""
  existingSecretDatabaseKey: ""
  existingSecretPasswordKey: ""
  annotations: {}
